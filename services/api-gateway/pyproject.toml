[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-gateway"
version = "0.1.0"
description = "Edge API gateway and transaction ingestion for Aegis AI Fraud Ops"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aegis-common",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "httpx>=0.27.0",
    "pydantic>=2.8.2,<3.0",
    "pydantic-settings>=2.4.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_gateway"]
