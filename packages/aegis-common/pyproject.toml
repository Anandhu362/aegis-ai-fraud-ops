[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-common"
version = "0.1.0"
description = "Shared schemas, errors, logging, and protocols for Aegis AI Fraud Ops"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8.2,<3.0",
    "pydantic-settings>=2.4.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "google-auth>=2.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_common"]
