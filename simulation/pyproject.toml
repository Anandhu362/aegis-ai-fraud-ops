[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-sim"
version = "0.1.0"
description = "Synthetic transaction generation and red-team evaluation suite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aegis-common",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "faker>=28.0.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_sim"]
