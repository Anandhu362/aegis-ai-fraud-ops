[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
    "simulation",
]

[tool.uv.sources]
aegis-common = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "PL",    # pylint
    "RUF",   # ruff-specific
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "PT",    # flake8-pytest-style
    "TID",   # flake8-tidy-imports
]
ignore = [
    "PLR0913", # Too many arguments in function definition
    "PLR0917", # Too many positional arguments
    "PLR0912", # Too many branches
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004"]
"scripts/**" = ["T201", "S101"]
"simulation/**" = ["S311", "PLR2004", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages", "services", "simulation"]
asyncio_mode = "auto"
markers = [
    "integration: tests against local emulators or databases",
    "e2e: end-to-end tests",
    "real_llm: tests hitting real Vertex AI Gemini API",
]
addopts = "-ra -q --strict-markers"
